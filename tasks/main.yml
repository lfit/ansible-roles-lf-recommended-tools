---
- name: Load operating-system specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yaml"
        - "{{ ansible_facts['distribution'] }}.yaml"
        - "{{ ansible_facts['os_family'] }}.yaml"
      paths:
        - "vars"

# Required for direct install of parallel package from linuxsoft.cern.ch
- name: Install RPM GPG certs
  ansible.builtin.rpm_key:
    state: present
    key: https://linuxsoft.cern.ch/cern/centos/7/os/x86_64/RPM-GPG-KEY-cern
  when: ansible_facts['os_family'] == 'RedHat'
  become: true

- name: Install LF Recommended Tools on RedHat
  ansible.builtin.yum:
    name: "{{ lf_recommended_tools_packages }}"
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
  become: true

- name: Install pre-packages on Debian
  # These packages must be installed before others on Ubuntu 24.04+
  ansible.builtin.package:
    name:
      - apt-utils
      - pcp
    state: present
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - ansible_facts['distribution_major_version'] | int >= 24
  become: true

- name: Install LF Recommended Tools on Debian
  # Note: apt module requires state: 'fixed' not in dnf or yum modules
  ansible.builtin.package:
    name: "{{ lf_recommended_tools_packages }}"
    state: fixed
  when: ansible_facts['os_family'] == 'Debian'
  become: true

- name: Install fedora-packager
  ansible.builtin.yum:
    name:
      - fedora-packager
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
  become: true

- name: Install PlantUML
  become: true
  block:
    - name: Create /opt/plantuml install directory
      ansible.builtin.file:
        path: /opt/plantuml
        state: directory
        mode: 0755
    # SourceForge's /download redirector regularly takes >10s to complete the
    # TLS handshake, which exceeds get_url's default timeout. Upstream now
    # publishes the same jar on GitHub releases, which is fast and serves a
    # valid certificate (so validate_certs no longer has to be disabled).
    - name: Fetch PlantUML
      ansible.builtin.get_url:
        url: https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar
        dest: /opt/plantuml/plantuml.jar
        mode: 0644
        timeout: 60
      register: result
      until: result is succeeded
      retries: 3
      delay: 30
    - name: Install PlantUML executable script
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          exec java -jar /opt/plantuml/plantuml.jar "$@"
        dest: /usr/local/bin/plantuml
        mode: 0755

- name: Add NodeSource repository/NodeJS
  vars:
    # Sets the packaged/baseline version of NodeJS
    nodejs_version: "22.x"
  block:
    - name: Add NodeSource repository/NodeJS under RedHat/CentOS
      become: true
      when: ansible_facts['os_family'] == 'RedHat'
      block:
        # NodeSource does not publish every Node stream for older EL releases:
        # pub_22.x has no el7 or el8 tree, and pub_20.x has no el7 (all 404).
        # yum then downloads the 404 HTML page and fails to open it as an RPM
        # ("Could not open: ...nodesource-release-el8-1.noarch.rpm"), so pin
        # each EL release to the newest stream NodeSource actually ships.
        - name: Select the NodeSource stream published for this EL release
          ansible.builtin.set_fact:
            nodejs_el_version: "{{ nodejs_el_streams[ansible_facts['distribution_major_version']]
              | default(nodejs_version) }}"
          vars:
            nodejs_el_streams:
              "7": "18.x"
              "8": "20.x"

        - name: Set up the Nodesource RPM directory.
          ansible.builtin.set_fact:
            nodejs_rhel_rpm_dir: "pub_{{ nodejs_el_version }}"

        - name: Import Nodesource RPM key
          ansible.builtin.rpm_key:
            key:
              https://rpm.nodesource.com/pub/el/NODESOURCE-GPG-SIGNING-KEY-EL
            state: present

        - name: Add Nodesource repositories for Node.js (CentOS 7/8 only).
          ansible.builtin.yum:
            name:
              "https://rpm.nodesource.com/{{ nodejs_rhel_rpm_dir }}/el/\
              {{ ansible_facts['distribution_major_version'] }}/\
              {{ ansible_facts['architecture'] }}/nodesource-release-el\
              {{ ansible_facts['distribution_major_version'] }}-1.noarch.rpm"
            state: present
          when:
            - ansible_facts['distribution_major_version'] | int >= 7
            - ansible_facts['distribution_major_version'] | int <= 8
          register: node_repo

        - name: Update package cache if repo was added.
          ansible.builtin.yum: update_cache=yes
          when: node_repo is changed
          tags: ["skip_ansible_lint"]

        - name: Ensure Node.js AppStream module is disabled (CentOS 8+).
          ansible.builtin.command: yum module disable -y nodejs  # noqa command-instead-of-module
          register: module_disable
          changed_when: "'Nothing to do.' not in module_disable.stdout"
          when:
            - ansible_facts['distribution_major_version'] | int >= 8
            - ansible_facts['distribution_major_version'] | int < 9

        - name: Ensure Node.js and npm are installed.
          ansible.builtin.yum:
            name: "nodejs-{{ nodejs_el_version | regex_replace('x', '') }}*"
            state: present
          when: ansible_facts['distribution_major_version'] | int < 9

        - name: Ensure Node.js and npm are installed (CentOS 9+).
          ansible.builtin.dnf:
            name: nodejs
            state: present
          when: ansible_facts['distribution_major_version'] | int >= 9

    - name: Add NodeSource repository/NodeJS under Ubuntu
      become: true
      when: ansible_facts['distribution'] == 'Ubuntu'
      block:
        - name: Create /etc/apt/keyrings directory
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'

        - name: Download NodeSource GPG key
          ansible.builtin.get_url:
            url: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
            dest: /etc/apt/keyrings/nodesource.asc
            mode: '0644'

        - name: Add NodeSource deb repository
          ansible.builtin.apt_repository:
            repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] \
                   https://deb.nodesource.com/node_{{ nodejs_version }} \
                   nodistro main"
            state: present

        - name: Add NodeSource deb-src repository
          ansible.builtin.apt_repository:
            repo: "deb-src [signed-by=/etc/apt/keyrings/nodesource.asc] \
                   https://deb.nodesource.com/node_{{ nodejs_version }} \
                   nodistro main"
            state: present

        - name: Install Node.js
          ansible.builtin.package:
            pkg:
              - nodejs
            state: present
            update_cache: true
